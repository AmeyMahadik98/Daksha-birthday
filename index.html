<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday my Strawberry ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      padding: 40px 20px;
      animation: fadeIn 2s ease-in;
    }

    /* NAME ANIMATION */
    .name span {
      opacity: 0;
      display: inline-block;
      font-size: 42px;
      font-weight: bold;
      animation: glow 0.5s forwards;
    }

    .name span:nth-child(1) { animation-delay: 0.2s; }
    .name span:nth-child(2) { animation-delay: 0.4s; }
    .name span:nth-child(3) { animation-delay: 0.6s; }
    .name span:nth-child(4) { animation-delay: 0.8s; }
    .name span:nth-child(5) { animation-delay: 1s; }
    .name span:nth-child(6) { animation-delay: 1.2s; }

    @keyframes glow {
      to {
        opacity: 1;
        text-shadow: 0 0 15px white, 0 0 30px #fff;
      }
    }

    p {
      font-size: 20px;
      max-width: 600px;
      margin: 20px auto;
      opacity: 0;
      animation: fadeInText 2s ease forwards;
      animation-delay: 2s;
    }

    @keyframes fadeInText {
      to { opacity: 1; }
    }

    .photo img {
      width: 80%;
      max-width: 300px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      margin-top: 20px;
      transform: scale(0.9);
      animation: zoomIn 2s ease forwards;
      animation-delay: 2.5s;
    }

    @keyframes zoomIn {
      to { transform: scale(1); }
    }

    .heart {
      font-size: 35px;
      animation: heartbeat 1s infinite;
      margin-top: 15px;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    button {
      margin-top: 25px;
      padding: 14px 24px;
      border: none;
      background: white;
      color: #ff4d6d;
      font-size: 18px;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    #final {
      display: none;
      font-size: 22px;
      margin-top: 25px;
      animation: fadeIn 2s ease;
    }

    /* Falling hearts */
    .floating-heart {
      position: fixed;
      top: -10px;
      font-size: 20px;
      animation: fall linear infinite;
      opacity: 0.7;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
      }
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>

<body>

<div class="container">

  <div class="name">
    <span>D</span><span>a</span><span>k</span><span>s</span><span>h</span><span>u</span>
  </div>

  <p>
    Some experiences are special… but even more special is the person who makes them unforgettable.  
    And for me, that person is you. ❤️
  </p>

  <div class="photo">
    <img src="IMG_2639.heic" alt="Our Memory ❤️">
  </div>

  <div class="heart">❤️</div>

  <button onclick="startExperience()">Tap slowly ❤️</button>

  <div id="final">
    Happy Birthday to my future wife 💍<br><br>
    I already consider you my wife.<br><br>
    I can’t wait to celebrate a lifetime of moments with you ❤️
  </div>

</div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="Song.mp3" type="audio/mpeg">
</audio>

<script>
  function startExperience() {
    const music = document.getElementById("bgMusic");

    music.volume = 0;
    music.play();

    // Fade in music
    let vol = 0;
    const fade = setInterval(() => {
      if (vol < 1) {
        vol += 0.05;
        music.volume = vol;
      } else {
        clearInterval(fade);
      }
    }, 200);

    document.getElementById("final").style.display = "block";
  }

  // Create falling hearts
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "floating-heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 2) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }, 300);
</script>

</body>
</html>
